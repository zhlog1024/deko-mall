# Common System Error Codes — used by ALL services
00000=Success
A0001=User error
A0200=User login error
A0201=User not found
A0202=User account locked
A0203=User account invalidated
A0210=Invalid username or password
A0211=Password attempts exceeded limit
A0212=Client authentication failed
A0230=Token invalid or expired
A0231=Token access forbidden
A0300=Access permission error
A0301=Access unauthorized
A0302=Demo environment prohibits add/modify/delete of important data
A0303=Request submitted, do not resubmit
A0400=Invalid request parameter
A0401=Resource not found
A0410=Required parameter is empty
A0700=File upload error
A0701=File type mismatch
A0702=File size exceeds limit
A0703=Image size exceeds limit
B0001=System error
B0100=System execution timeout
B0200=System disaster recovery triggered
B0210=System rate limiting
B0220=System degradation
B0300=System resource error
B0310=System resource exhausted
B0320=System resource access error
B0321=Failed to read disk file
C0001=Third-party service error
C0100=Middleware service error
C0113=Interface not found
C0120=Message service error
C0121=Message delivery error
C0122=Message consumption error
C0123=Message subscription error
C0124=Message group not found
C0300=Database service error
C0311=Table not found
C0312=Column not found
C0321=Duplicate column name in multi-table join
C0331=Database deadlock
C0341=Primary key conflict
