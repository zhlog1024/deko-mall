# ==================== Dictionary Errors (SYS_001 ~ SYS_009) ====================
SYS_001=Dictionary type not found
SYS_002=Dictionary item not found

# ==================== File Errors (SYS_010 ~ SYS_019) ====================
SYS_010=File upload failed
SYS_011=File not found
SYS_012=File size exceeds limit

# ==================== SMS Errors (SYS_020 ~ SYS_029) ====================
SYS_020=SMS send failed
SYS_021=SMS template not found

# ==================== Message Errors (SYS_070 ~ SYS_079) ====================
SYS_070=Message channel not found
SYS_071=Template not found
SYS_072=Template code already exists
SYS_073=Template rendering failed

# ==================== Region Errors (SYS_030 ~ SYS_039) ====================
SYS_030=Region not found

# ==================== Menu/Permission Errors (SYS_040 ~ SYS_049) ====================
SYS_040=Menu not found
SYS_041=Permission denied

# ==================== Role/User Errors (SYS_050 ~ SYS_059) ====================
SYS_050=Role not found
SYS_051=User not found

# ==================== Config Errors (SYS_060 ~ SYS_069) ====================
SYS_060=Configuration not found

# ==================== General Operation Errors (SYS_080 ~ SYS_089) ====================
SYS_080=Operation failed
SYS_081=Data not found
SYS_082=Invalid parameter

# ==================== System Reserved Error Codes (SYS_900 ~ SYS_999) ====================
SYS_900=System error
SYS_999=Unknown error
