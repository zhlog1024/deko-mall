# Deko Mall 本地容器部署：docker compose up -d。
# 中间件就绪后发布 Nacos 配置，发布成功后再启动业务服务。
# 初始化数据来自开发库快照，账号和业务数据以 SQL 内容为准。
name: deko-mall

services:
  # 中间件
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-deko_root_2024}
      MYSQL_DATABASE: deko_mall
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./db/deko_mall.sql
        target: /docker-entrypoint-initdb.d/01-deko-mall.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot -D deko_mall -Nse 'SELECT 1 FROM sys_user LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks: [deko]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-deko_redis_2024}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-deko_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [deko]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-deko}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-deko_mq_2024}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"   # 管理台
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [deko]

  # MinIO 对象存储；切换存储服务时调整 storage.type 与对应凭据。
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deko}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deko_minio_2024}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"     # S3 API（默认 9002，避开本机 mall-auth:9000）
      - "127.0.0.1:${MINIO_UI_PORT:-9001}:9001"     # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      # 官方镜像自带 curl；比依赖 mc alias 的 `mc ready local` 更稳
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [deko]

  nacos:
    image: nacos/nacos-server:v2.3.2
    platform: linux/amd64 # 该版本未提供 ARM 镜像，Apple Silicon 使用 Docker 仿真
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_KEY:-dekoIdentityKey}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_VALUE:-dekoIdentityValue}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-ZGVrby1tYWxsLWRlbW8tc2VjcmV0LWtleS0zMi1ieXRlcw==}
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [deko]

  # 发布配置并回读验证，成功后才启动后端服务。
  nacos-config-publisher:
    build: { context: ., dockerfile: Dockerfile.nacos-publisher }
    restart: "no"
    depends_on:
      nacos: { condition: service_healthy }
    environment:
      NACOS_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      MAX_WAIT: "180"
      CONFIG_DIR: /config
      NAMESPACE: ${NACOS_NAMESPACE:-deko-mall-docker}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      CREATE_NAMESPACE: "true"
    volumes:
      - ./publish-nacos-config.sh:/publish.sh:ro
      - ./nacos/config:/config:ro
    entrypoint: ["bash", "/publish.sh"]
    networks: [deko]

  # 后端微服务
  # 统一通过环境变量注入连接信息，配置从 Nacos 拉取。
  mall-gateway:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-gateway/target/*.jar } }
    restart: unless-stopped
    environment: &backend-env
      SPRING_PROFILES_ACTIVE: prod
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-deko-mall-docker}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      GATEWAY_ENDPOINT: http://localhost:${GATEWAY_PORT:-9999}
      JWK_SET_URI: http://mall-auth:9000/oauth2/jwks
      MINIO_CUSTOM_DOMAIN: ${MINIO_CUSTOM_DOMAIN:-http://127.0.0.1:9002/deko-mall}
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx256m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: deko_mall
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-deko_root_2024}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-deko_redis_2024}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-deko}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-deko_mq_2024}
      # 对象存储（mall-system 的文件上传读取这些变量）
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-deko}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-deko_minio_2024}
      MINIO_BUCKET: ${MINIO_BUCKET:-deko-mall}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-9999}:9999"
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-auth:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-auth/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-system:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-system/system-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-ums:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-ums/ums-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-pms:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-pms/pms-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-oms:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-oms/oms-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-pay:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-pay/pay-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-sms:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-sms/sms-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-cms:
    build: { context: .., dockerfile: deploy/Dockerfile.j17, args: { JAR_FILE: mall-cms/cms-boot/target/*.jar } }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      nacos: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # 必须等配置发布成功，否则服务启动时拉不到 mall-common.yaml
      nacos-config-publisher: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    networks: [deko]

  mall-admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP_DIR: mall-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-9527}:80"
    depends_on:
      mall-gateway: { condition: service_started }
    networks: [deko]

  mall-scm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP_DIR: mall-scm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCM_PORT:-9528}:80"
    depends_on:
      mall-gateway: { condition: service_started }
    networks: [deko]

  # 用户端 H5：需本机先用 HBuilderX 发行到 mall-app/unpackage/dist/build/web
  # 启用：docker compose --profile app up -d
  mall-app:
    image: nginx:1.28-alpine
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ../mall-app/unpackage/dist/build/web
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx-web.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mall-gateway: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [deko]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  minio-data:

networks:
  deko:
    driver: bridge
