spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${MYSQL_DATABASE:deko_mall}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${mysql.username}
    password: ${mysql.password}
  data:
    redis:
      database: ${redis.database}
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}
      lettuce:
        pool:
          min-idle: 1
  # RabbitMQ 配置
  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
    virtual-host: /
  cache:
    # 缓存类型
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
      # 允许使用缓存前缀，
      use-key-prefix: true

mybatis-plus:
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Seata 配置(cms 无跨服务写事务,关闭避免依赖 seata-server)
seata:
  enabled: false

# feign 配置
feign:
  sentinel:  # 开启feign对sentinel的支持
    enabled: false

# 安全配置:文章/协议/自定义页/DIY页面对游客可见(app 登录页协议、首页底栏、分享文章列表、自定义页)
security:
  # 白名单
  whitelist-paths:
    - /app-api/v1/article/**
    - /app-api/v1/agreement/**
    - /app-api/v1/custom-view/**
    - /app-api/v1/diy-pages/**
    - /feign-api/v1/**

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.deko.mall.cms.controller
  # Api文档信息
  info:
    title: Deko Mall 内容服务
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
    description: 文章分类、文章、协议等内容资产接口
    contact:
      name: Deko Mall
      url: https://github.com/zhlog1024/deko-mall
    license:
      name: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.html

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: false
  setting:
    language: zh_cn
