spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host}:${mysql.port}/${MYSQL_DATABASE:deko_mall}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${mysql.username}
    password: ${mysql.password}
  # RabbitMQ 配置
  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
  data:
    redis:
      database: ${redis.database}
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}
      lettuce:
        pool:
          min-idle: 1
mybatis-plus:
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Feign 配置
feign:
  sentinel:  # 开启feign对sentinel的支持
    enabled: false

# 安全配置
security:
  # 白名单路径
  whitelist-paths:
      - /app-api/v1/carts
      - /callback-api/v1/logistics/kuaidi100
      - /feign-api/orders/no/*
      - /app-api/v1/carts/count


# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.deko.mall.oms.controller
  # Api文档信息
  info:
    title: Deko Mall 订单服务
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
    description: 订单、购物车等接口
    contact:
      name: Deko Mall
      url: https://github.com/zhlog1024/deko-mall
    license:
      name: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.html
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: false
  setting:
    language: zh_cn


# 订单积分抵扣开关（默认 true，设为 false 可关闭积分抵扣）
mall.order.points-deduction-enabled: false

# 物流配置
logistics:
  kuaidi100:
    # 快递100授权key
    key: ${KUAIDI100_KEY:CHANGEME}
    # 快递100用户编号
    customer: ${KUAIDI100_CUSTOMER:CHANGEME}
    # 回调地址
    callback-url: ${GATEWAY_ENDPOINT:http://localhost:9999}/mall-oms/callback-api/v1/logistics/kuaidi100
    salt: ${KUAIDI100_SALT:CHANGEME}

wx:
  miniapp:
    appId: ${WX_APP_ID:wx0000000000000000}
    appSecret: ${WX_APP_SECRET:CHANGEME}
    mchId: ${WX_MCH_ID:CHANGEME}
