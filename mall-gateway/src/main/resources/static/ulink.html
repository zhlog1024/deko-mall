<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>示例商城</title>
    <meta name="apple-itunes-app" content="app-id=0000000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 14vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fff;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .sub {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
            padding: 0 24px;
        }
        .btn {
            display: inline-block;
            width: 260px;
            padding: 14px 0;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .btn-green {
            background: #07c160;
            color: #fff;
        }
        .btn-green:active { opacity: 0.8; }
    </style>
</head>
<body>
    <img class="logo" src="https://example-bucket.oss-cn-hangzhou.aliyuncs.com/static/app/warm/common/logo.png" alt="示例商城">
    <p class="title">示例商城</p>
    <p class="sub">下载 APP 体验完整功能</p>
    <a class="btn btn-green" href="https://apps.apple.com/cn/app/id0000000000">下载 APP</a>
</body>
</html>
