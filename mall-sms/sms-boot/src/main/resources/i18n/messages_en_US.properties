# ==================== Coupon Errors (SMS_001 ~ SMS_019) ====================
SMS_001=Coupon not found
SMS_002=Coupon has expired
SMS_003=Coupon already received
SMS_004=Coupon receive limit reached

# ==================== Promotion Errors (SMS_020 ~ SMS_029) ====================
SMS_020=Promotion not found
SMS_021=Promotion has ended
SMS_022=Promotion has not started

# ==================== Seckill Errors (SMS_030 ~ SMS_039) ====================
SMS_030=Seckill activity not found
SMS_031=Seckill activity has ended
SMS_032=Seckill stock is empty

# ==================== Template Errors (SMS_040 ~ SMS_049) ====================
SMS_040=Template not found

# ==================== General Operation Errors (SMS_060 ~ SMS_069) ====================
SMS_060=Operation failed
SMS_061=Data not found
SMS_062=Invalid parameter

# ==================== System Reserved Error Codes (SMS_900 ~ SMS_999) ====================
SMS_900=System error
SMS_999=Unknown error
