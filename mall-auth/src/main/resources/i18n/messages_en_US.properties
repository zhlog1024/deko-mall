# ==================== Authentication Errors (AUTH_001 ~ AUTH_019) ====================
AUTH_001=Authentication failed
AUTH_002=Token expired
AUTH_003=Token invalid
AUTH_004=Refresh token invalid
AUTH_005=Account locked
AUTH_006=Captcha error
AUTH_007=Supplier not found

# ==================== Authorization Errors (AUTH_020 ~ AUTH_029) ====================
AUTH_020=Access denied
AUTH_021=Insufficient permissions

# ==================== General Operation Errors (AUTH_060 ~ AUTH_069) ====================
AUTH_060=Operation failed
AUTH_061=Invalid parameter

# ==================== System Reserved Error Codes (AUTH_900 ~ AUTH_999) ====================
AUTH_900=System error
AUTH_999=Unknown error
